name: Subtitle gzip migration

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Stage a canary or full plan, switch verified tracks, or prune their plain predecessors.
        type: choice
        options: [canary, stage, migrate, prune]
        default: canary
      verified_sha256:
        description: Locally verified plan fingerprint for migrate and prune.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: production-subtitle-cleanup
  cancel-in-progress: false

jobs:
  migrate:
    if: >-
      github.ref == 'refs/heads/main' && github.repository_id == '1462854175' &&
      github.actor_id == github.repository_owner_id && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: Production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Run the selected migration phase
        env:
          YOMIRU_GZIP_PHASE: ${{ inputs.phase }}
          YOMIRU_GZIP_VERIFIED_SHA256: ${{ inputs.verified_sha256 }}
        run: node web/scripts/migrate-subtitles-gzip.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.phase == 'canary' || inputs.phase == 'stage'
        with:
          name: subtitle-gzip-plan
          path: ${{ runner.temp }}/subtitle-gzip-plan.json
          retention-days: 2
          if-no-files-found: error
