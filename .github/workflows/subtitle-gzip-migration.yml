name: Subtitle gzip migration

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Stage a canary, switch verified tracks, or prune their plain predecessors.
        type: choice
        options: [canary, migrate, prune]
        default: canary

permissions:
  contents: read

concurrency:
  group: production-subtitle-cleanup
  cancel-in-progress: false

jobs:
  migrate:
    if: >-
      github.ref == 'refs/heads/main' && github.repository_id == '1462854175' &&
      github.actor_id == github.repository_owner_id && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: Production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Run the selected migration phase
        env:
          YOMIRU_GZIP_PHASE: ${{ inputs.phase }}
        run: node web/scripts/migrate-subtitles-gzip.mjs
