name: Production delivery
run-name: ${{ inputs.release_sha && format('Release Yomiru {0}', inputs.release_sha) || 'Sync Yomiru Production configuration' }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current main commit approved for publication (leave blank for configuration sync)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: production-secret-delivery
  cancel-in-progress: false

jobs:
  reuse:
    name: Check for a fresh automatic Production sync
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      github.repository_id == '1462854175' && github.actor_id == github.repository_owner_id &&
      github.triggering_actor == github.repository_owner && inputs.release_sha == github.sha &&
      github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      reusable: ${{ steps.sync.outputs.reusable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Verify the exact commit and sync timing
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release_yomiru.py reuse-sync

  secrets:
    name: Check committed secrets before Production sync
    needs: reuse
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (github.run_attempt != '1' || needs.reuse.result != 'success' || needs.reuse.outputs.reusable != 'true') &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.action == 'completed' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_sha == github.sha &&
        github.event.workflow_run.path == '.github/workflows/ci.yml' &&
        github.event.workflow_run.repository.id == github.repository_id &&
        github.event.workflow_run.head_repository.id == github.repository_id))
    uses: tsilva/.github/.github/workflows/secret-scanning.yml@0d0ba90f60d8f3affcb5d61941e9729367db4702

  sync:
    name: Sync Yomiru configuration to Production
    needs: secrets
    if: ${{ !cancelled() && needs.secrets.result == 'success' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: tsilva/.github/.github/workflows/production-delivery.yml@22ae9ec7263f27ba0115d78bce448700273b0d7d
    with:
      sync_only: true
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  publish:
    name: Stage, verify, and publish the approved release
    needs: [reuse, sync]
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      github.repository_id == '1462854175' && github.actor_id == github.repository_owner_id &&
      github.triggering_actor == github.repository_owner && inputs.release_sha == github.sha &&
      ((github.run_attempt == '1' && needs.reuse.result == 'success' && needs.reuse.outputs.reusable == 'true') ||
       needs.sync.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: Production
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the scan and sync for this release attempt
        if: github.run_attempt != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release_yomiru.py verify-retry-sync
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install the pinned release tools
        run: |
          npm install --prefix "$RUNNER_TEMP/vercel-cli" --no-save --ignore-scripts --min-release-age=7 \
            vercel@65.4.0 rollup@4.62.2 yaml@2.9.1
          echo "$RUNNER_TEMP/vercel-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Publish only the committed web tree
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          YOMIRU_RELEASE_SHA: ${{ inputs.release_sha }}
          YOMIRU_RELEASE_TOOLS: ${{ runner.temp }}/vercel-cli
        run: bash .github/scripts/publish-yomiru.sh
