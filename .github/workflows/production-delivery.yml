name: Production delivery
run-name: ${{ inputs.release_sha && format('Release Yomiru {0}', inputs.release_sha) || 'Sync Yomiru Production configuration' }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current main commit approved for publication (leave blank for configuration sync)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: production-secret-delivery
  cancel-in-progress: false

jobs:
  secrets:
    name: Check committed secrets before Production sync
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.action == 'completed' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_sha == github.sha &&
        github.event.workflow_run.path == '.github/workflows/ci.yml' &&
        github.event.workflow_run.repository.id == github.repository_id &&
        github.event.workflow_run.head_repository.id == github.repository_id))
    uses: tsilva/.github/.github/workflows/secret-scanning.yml@0d0ba90f60d8f3affcb5d61941e9729367db4702

  sync:
    name: Sync archive configuration to Production
    needs: secrets
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: tsilva/.github/.github/workflows/production-delivery.yml@0d0ba90f60d8f3affcb5d61941e9729367db4702
    with:
      sync_only: true
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  publish:
    name: Stage, verify, and publish the approved release
    needs: sync
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      github.repository_id == '1462854175' && github.actor_id == github.repository_owner_id &&
      github.triggering_actor == github.repository_owner && inputs.release_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install the pinned Vercel CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/vercel-cli" --no-save --ignore-scripts --min-release-age=7 vercel@65.4.0
          echo "$RUNNER_TEMP/vercel-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Publish only the committed web tree
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          YOMIRU_RELEASE_SHA: ${{ inputs.release_sha }}
        run: bash .github/scripts/publish-yomiru.sh
