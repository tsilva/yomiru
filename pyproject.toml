[project]
name = "yomiru"
version = "0.1.0"
description = "Japanese learning subtitles for Stremio"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "cutlet>=0.5.2,<0.6",
  "jaconv>=0.5,<0.6",
  "unidic-lite==1.0.8",
]

[project.scripts]
yomiru = "yomiru.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.14,<0.15"]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
