<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 480 400"
     role="img" aria-labelledby="title description">
  <title id="title">Yomiru’s subtitle fox</title>
  <desc id="description">A smiling orange fox peeks over two subtitle lines. The yellow line reads よめた！ and the blue line reads I read it!</desc>
  <defs>
    <radialGradient id="halo">
      <stop stop-color="#e67a69" stop-opacity=".27"/>
      <stop offset="1" stop-color="#e67a69" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orange" x2=".3" y2="1">
      <stop stop-color="#ff8151"/>
      <stop offset="1" stop-color="#fb663b"/>
    </linearGradient>
    <linearGradient id="yellow" x2="1" y2="1">
      <stop stop-color="#fff1bc"/>
      <stop offset="1" stop-color="#ffdc85"/>
    </linearGradient>
    <linearGradient id="blue" x2="1" y2="1">
      <stop stop-color="#b4f2ff"/>
      <stop offset="1" stop-color="#75d5f4"/>
    </linearGradient>
    <clipPath id="tail-tip">
      <path d="M153 170C171 158 168 127 181 104C191 86 206 77 220 80
               C207 98 228 107 221 136C215 164 191 182 169 185Z"/>
    </clipPath>
    <clipPath id="peek">
      <path d="M0 0H256V161H0Z"/>
    </clipPath>
    <path id="spark" d="M0-10Q1-1 10 0Q1 1 0 10Q-1 1-10 0Q-1-1 0-10Z"/>
  </defs>

  <style>
    .head, .tail, .paw, .caption, .shine, .sparkle, .pulse, .smile, .wink {
      animation-duration: 4.8s;
      animation-iteration-count: infinite;
      animation-timing-function: cubic-bezier(.35, 0, .2, 1);
    }
    .head { animation-name: peek; }
    .tail { animation-name: swish; transform-origin: 169px 173px; }
    .paw { animation-name: grab; transform-box: fill-box; transform-origin: center bottom; }
    .paw-right { animation-name: grab-right; }
    .kana { animation-name: kana; }
    .meaning { animation-name: meaning; }
    .shine { animation-name: shine; animation-timing-function: linear; opacity: 0; }
    .sparkle { animation-name: sparkle; transform-box: fill-box; transform-origin: center; opacity: 0; }
    .sparkle-small { animation-name: sparkle-small; }
    .pulse { animation-name: pulse; transform-box: fill-box; transform-origin: center; }
    .smile { animation-name: smile; }
    .wink { animation-name: wink; opacity: 0; }
    @keyframes peek {
      0%, 100% { transform: translateY(12px); }
      9% { transform: translateY(15px); }
      21% { transform: translateY(-10px); }
      32%, 70% { transform: translateY(0); }
      58% { transform: translateY(-2px); }
    }
    @keyframes swish {
      0%, 100% { transform: rotate(9deg); }
      11% { transform: rotate(13deg); }
      23% { transform: rotate(-12deg); }
      39% { transform: rotate(4deg); }
      56% { transform: rotate(-5deg); }
      75% { transform: rotate(0); }
    }
    @keyframes grab {
      0%, 12%, 100% { transform: scaleY(.55); }
      25% { transform: scaleY(1.07); }
      35%, 78% { transform: scaleY(1); }
    }
    @keyframes grab-right {
      0%, 15%, 100% { transform: scaleY(.55); }
      28% { transform: scaleY(1.08); }
      38%, 80% { transform: scaleY(1); }
    }
    @keyframes kana {
      0%, 23%, 97%, 100% { opacity: 0; transform: translateX(-5px); }
      35%, 82% { opacity: 1; transform: translateX(0); }
    }
    @keyframes meaning {
      0%, 34%, 97%, 100% { opacity: 0; transform: translateX(-5px); }
      45%, 82% { opacity: 1; transform: translateX(0); }
    }
    @keyframes shine {
      0%, 40%, 63%, 100% { opacity: 0; }
      45% { opacity: .4; }
      40%, 41% { transform: translateX(-20px); }
      62%, 63% { transform: translateX(190px); }
    }
    @keyframes sparkle {
      0%, 40%, 69%, 100% { opacity: 0; transform: translateY(4px) scale(.25) rotate(-18deg); }
      50% { opacity: 1; transform: translateY(-3px) scale(1) rotate(0); }
      61% { opacity: .6; transform: translateY(-9px) scale(.7) rotate(12deg); }
    }
    @keyframes sparkle-small {
      0%, 45%, 72%, 100% { opacity: 0; transform: translateY(4px) scale(.2); }
      54% { opacity: 1; transform: translateY(-3px) scale(1); }
      65% { opacity: .45; transform: translateY(-8px) scale(.65); }
    }
    @keyframes pulse {
      0%, 100% { opacity: .75; transform: scale(.94); }
      42%, 63% { opacity: 1; transform: scale(1.06); }
    }
    @keyframes smile {
      0%, 55%, 62%, 100% { opacity: 1; }
      56%, 61% { opacity: 0; }
    }
    @keyframes wink {
      0%, 55%, 62%, 100% { opacity: 0; }
      56%, 61% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .head, .tail, .paw, .caption, .shine, .sparkle, .pulse, .smile, .wink { animation: none; }
    }
  </style>

  <ellipse class="pulse" cx="239" cy="186" rx="190" ry="167" fill="url(#halo)"/>
  <ellipse cx="230" cy="331" rx="98" ry="9" fill="#0a0d21" opacity=".6"/>

  <g transform="translate(81 37) scale(1.23)" stroke="#0b1237" stroke-linejoin="round">
    <g class="tail">
      <path d="M153 170C171 158 168 127 181 104C191 86 206 77 220 80
               C207 98 228 107 221 136C215 164 191 182 169 185Z"
            fill="url(#orange)" stroke-width="7"/>
      <path d="M171 105C181 111 188 106 193 103L191 118Q201 117 205 111
               L208 126Q219 121 224 111L239 78L187 66Z"
            fill="#fff3de" stroke="none" clip-path="url(#tail-tip)"/>
      <path d="M153 170C171 158 168 127 181 104C191 86 206 77 220 80
               C207 98 228 107 221 136C215 164 191 182 169 185Z" fill="none" stroke-width="6"/>
    </g>

    <g clip-path="url(#peek)">
      <path d="M83 139Q112 146 143 139L151 161H75Z" fill="#0b1237" stroke="none"/>
      <g class="head">
        <path d="M56 108C40 88 40 45 53 32C63 22 84 39 101 63
                 Q112 59 124 63C142 38 160 26 170 31C184 39 187 79 170 105
                 Q175 110 183 112C185 124 168 147 148 153Q111 165 79 153
                 C60 148 45 132 40 114Q49 112 56 108Z"
              fill="url(#orange)" stroke-width="7"/>
        <path d="M60 82C55 74 56 64 60 64L65 65C56 38 75 47 91 70
                 M163 82C171 71 169 62 163 65L160 66C170 38 151 47 134 70"
              fill="#fff3de" stroke="none"/>
        <path d="M55 107Q69 77 92 71M173 106Q157 78 134 71"
              fill="none" stroke-width="4" stroke-linecap="round"/>
        <path d="M44 116C58 122 64 106 77 100C91 93 102 101 107 119
                 Q113 117 119 119C124 100 136 93 150 100C164 106 169 121 179 116
                 C175 137 150 150 113 151C79 151 52 139 44 116Z"
              fill="#fff3de" stroke="none"/>
        <path d="M75 117Q86 105 98 117" fill="none" stroke-width="5" stroke-linecap="round"/>
        <path class="smile" d="M128 117Q140 105 152 117" fill="none" stroke-width="5" stroke-linecap="round"/>
        <path class="wink" d="M129 115Q141 119 152 111" fill="none" stroke-width="5" stroke-linecap="round"/>
        <path d="M105 127C105 122 121 122 121 127Q119 133 113 134Q107 133 105 127Z"
              fill="#0b1237" stroke="none"/>
        <g fill="#fb8e71" stroke="none" opacity=".75">
          <ellipse cx="65" cy="126" rx="7" ry="3"/>
          <ellipse cx="160" cy="126" rx="7" ry="3"/>
        </g>
      </g>
    </g>

    <rect x="29" y="153" width="171" height="78" rx="21" fill="#0b1237" stroke="#fff3de" stroke-width="3"/>
    <rect x="37" y="162" width="155" height="29" rx="11" fill="url(#yellow)" stroke="none"/>
    <rect x="37" y="197" width="155" height="24" rx="9" fill="url(#blue)" stroke="none"/>
    <g stroke="none" fill="#141b42" text-anchor="middle" font-weight="700">
      <text class="caption kana" x="114.5" y="182" font-size="17"
            font-family="Hiragino Sans, Yu Gothic, Noto Sans CJK JP, sans-serif">よめた！</text>
      <text class="caption meaning" x="114.5" y="214" font-size="13.5"
            font-family="system-ui, sans-serif">I read it!</text>
    </g>
    <clipPath id="bars">
      <rect x="37" y="162" width="155" height="29" rx="11"/>
      <rect x="37" y="197" width="155" height="24" rx="9"/>
    </clipPath>
    <g clip-path="url(#bars)" stroke="none">
      <path class="shine" d="M26 156H43L16 227H-1ZM47 156H52L25 227H20Z" fill="#fff"/>
    </g>

    <path class="paw" d="M48 143C53 131 69 128 80 136C89 142 90 156 83 159
                         Q77 162 75 155Q75 161 70 161Q64 162 63 155Q61 162 55 160
                         C49 159 46 152 48 143Z"
          fill="url(#orange)" stroke-width="5" stroke-linecap="round"/>
    <path class="paw paw-right" d="M140 143C145 132 161 128 172 135C180 140 184 153 177 159
                                   Q171 162 168 155Q169 162 162 161Q156 162 154 155
                                   Q153 162 147 160C141 159 137 153 140 143Z"
          fill="url(#orange)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g fill="#ffe4a2">
    <g transform="translate(102 134)"><use class="sparkle" href="#spark"/></g>
    <g transform="translate(85 155) scale(.43)"><use class="sparkle sparkle-small" href="#spark"/></g>
  </g>
  <g fill="#a7eaff">
    <g transform="translate(376 170) scale(.85)"><use class="sparkle sparkle-small" href="#spark"/></g>
    <g transform="translate(393 149) scale(.43)"><use class="sparkle" href="#spark"/></g>
  </g>
</svg>
